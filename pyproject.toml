[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelty-multi-agent-framework"
version = "0.1.0"
description = "LangGraph framework for evidence-grounded academic novelty research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "PyMuPDF>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.20,<1.0",
]
browser = [
    "playwright>=1.40,<2.0",
]

[project.scripts]
novelty-demo = "novelty_agent_framework.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
novelty_agent_framework = [
    "config/*.json",
    "templates/**/*.md",
    "prompts/**/*.md",
    "skills/**/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: 真实应用／运行时边界或需要外部网络／模型的集成测试，默认跳过",
]
